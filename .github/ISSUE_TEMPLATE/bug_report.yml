name: Bug report
description: Report a problem with dsh-power-menu
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** paste credentials, session data, or full user paths.
        For security issues, use the private advisory flow in SECURITY.md instead.

  - type: input
    id: dsh-version
    attributes:
      label: DSH Desktop version
      placeholder: "e.g. 0.2.1-rc.2"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: dsh-power-menu version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a session
        2. Click the power button
        3. Choose ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From %USERPROFILE%\.dsh\dsh-power-menu\ (redact anything private)
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am on Windows and using DSH Desktop (not `dsh web`).
          required: true
        - label: I have restarted DSH after installing/enabling the plugin.
          required: true
